<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI财报分析</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 400px;
        min-height: 300px;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell,
          sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #333;
      }

      .container {
        padding: 20px;
        color: white;
      }

      .header {
        text-align: center;
        margin-bottom: 20px;
      }

      .header h1 {
        font-size: 20px;
        margin-bottom: 5px;
      }

      .header p {
        font-size: 12px;
        opacity: 0.9;
      }

      .content {
        background: white;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 15px;
        color: #333;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .content p {
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 10px;
      }

      .status {
        font-size: 12px;
        padding: 8px;
        border-radius: 4px;
        background: #f0f0f0;
        margin-bottom: 10px;
      }

      .status.ready {
        background: #d4edda;
        color: #155724;
      }

      .status.notpdf {
        background: #fff3cd;
        color: #856404;
      }

      .button-group {
        display: flex;
        gap: 10px;
      }

      button {
        flex: 1;
        padding: 10px 15px;
        border: none;
        border-radius: 4px;
        font-size: 14px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s ease;
      }

      .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      }

      .btn-primary:active {
        transform: translateY(0);
      }

      .btn-secondary {
        background: #f0f0f0;
        color: #333;
        border: 1px solid #ddd;
      }

      .btn-secondary:hover {
        background: #e8e8e8;
      }

      .instructions {
        background: #e3f2fd;
        border-left: 4px solid #1976d2;
        padding: 10px;
        border-radius: 4px;
        font-size: 12px;
        color: #1565c0;
        line-height: 1.6;
      }

      .instructions strong {
        display: block;
        margin-bottom: 5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>📊 AI财报分析</h1>
        <p>智能财务数据分析工具</p>
      </div>

      <div class="content">
        <div id="status" class="status notpdf">📋 请在浏览器中打开PDF文件</div>

        <p id="description">
          在浏览器中打开您的PDF财报文件，然后右键点击→选择"AI财报分析"，即可开始智能分析。
        </p>

        <div class="instructions">
          <strong>使用步骤：</strong>
          1. 在浏览器中打开PDF文件<br />
          2. 右键点击页面<br />
          3. 选择"AI财报分析"<br />
          4. 开始分析财报数据
        </div>
      </div>

      <div class="button-group">
        <button class="btn-secondary" id="closeBtn">关闭</button>
        <button class="btn-primary" id="openAnalyzerBtn" disabled>打开分析</button>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
